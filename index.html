<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Training Simulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .warning {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border: 1px solid #ffeeba;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        h2 {
            color: #1e293b;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .reset {
            background: #64748b;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
            color: #15803d;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Password Security Training</h2>
    <div class="warning">
        <strong>TRAINING SIMULATION ONLY</strong><br>
        This is a dummy password field.
        Do not enter a real password.
        Nothing entered is collected, stored or transmitted.
    </div>
    <form id="trainingForm" autocomplete="off">
        <label for="dummyPassword">
            Dummy Password
        </label>
        <input
            type="password"
            id="dummyPassword"
            placeholder="Enter a fictional password"
            autocomplete="off"
        >
        <button type="submit">
            Run Simulation
        </button>
        <button type="reset" class="reset">
            Clear Field
        </button>
    </form>
    <div id="message">
        Ready for training.
    </div>
    <div class="footer">
        Educational Demonstration | No Data Collection
    </div>
</div>
<script>
    const form = document.getElementById("trainingForm");
    const message = document.getElementById("message");
    const passwordField = document.getElementById("dummyPassword");
    // Prevent normal form submission.
    form.addEventListener("submit", function(event) {
        event.preventDefault();
        // Do not read or inspect the password field.
        message.textContent =
            "Simulation completed successfully!";
        // Clear the field without reading its contents.
        passwordField.value = "";
    });
    // Reset the training message.
    form.addEventListener("reset", function() {
        message.textContent = "Ready for training.";
    });
</script>
</body>
</html>
